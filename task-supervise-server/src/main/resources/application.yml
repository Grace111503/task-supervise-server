server:
  port: 8080

spring:
  application:
    name: task-supervise-server

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  datasource:
    url: jdbc:mysql://118.25.44.250:3308/task_supervise_server?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Root123456

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      # 无密码时留空即可
      password:
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: 118.25.44.250
    port: 5672
    username: admin
    password: 123456
    virtual-host: /task_supervise

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.enterprise.tasksuperviseserver.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: "task-supervise-server-secret-key-please-change-in-production-env"
  # Access Token 有效期（秒）默认 2 小时
  access-expire: 7200
  # Refresh Token 有效期（秒）默认 7 天
  refresh-expire: 604800

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: task-supervise-service

# 日志配置
logging:
  level:
    com.enterprise.tasksuperviseserver: debug
    org.springframework.web: info

# 文件上传配置
file:
  upload-dir: ${user.dir}/uploads
  # 允许的文件类型（逗号分隔），留空表示不限制
  allowed-types: doc,docx,xls,xlsx,pdf,jpg,jpeg,png,mp4
  # 单文件最大大小（MB）
  max-size: 100
